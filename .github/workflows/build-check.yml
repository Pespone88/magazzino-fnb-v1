name: Build check

on:
  push:
    branches: [main, feature/movimenti-giacenze]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: magazzino-fnb-v1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Vitest
        id: vitest
        continue-on-error: true
        run: |
          set -o pipefail
          npm run test:run -- --reporter=verbose 2>&1 | tee vitest.log
      - name: Upload Vitest diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-diagnostics
          path: magazzino-fnb-v1/vitest.log
      - name: Fail if Vitest failed
        if: steps.vitest.outcome == 'failure'
        run: exit 1
      - name: Node/bootstrap tests
        run: npm run test:bootstrap
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
