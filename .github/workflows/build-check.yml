name: Build check

on:
  push:
    branches: [main, feature/catalogo-fornitori]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: magazzino-fnb-v1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Test
        run: npm run test:run
      - name: Bootstrap tests
        run: npm run test:bootstrap
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
